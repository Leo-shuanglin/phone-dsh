name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: XcodeGen
        run: brew install xcodegen
      - name: Pinned DeepSeek Harness checkout
        run: |
          set -euo pipefail
          repo=$(node -e 'console.log(require("./plugins/dsh-pin.json").repo)')
          commit=$(node -e 'console.log(require("./plugins/dsh-pin.json").commit)')
          git clone --filter=blob:none "$repo" "$RUNNER_TEMP/dsh" && git -C "$RUNNER_TEMP/dsh" checkout "$commit"
          corepack enable && (cd "$RUNNER_TEMP/dsh" && pnpm install --frozen-lockfile && pnpm build)
          echo "PDSH_DSH_CHECKOUT=$RUNNER_TEMP/dsh" >> "$GITHUB_ENV"
      # The plugins stage is split so a typecheck error cannot hide the test
      # result, and neither can hide the static gates below (both used to be
      # unreachable: `npm run typecheck && npm test` fails the job at the first
      # command, and every later step is skipped). The two soft steps keep the
      # job running; the final step turns their outcome back into a failure.
      - name: Plugins (install)
        run: cd plugins && npm ci
      - name: Plugins (typecheck)
        id: plugins-typecheck
        continue-on-error: true
        run: cd plugins && npm run typecheck
      - name: Plugins (tests)
        id: plugins-tests
        continue-on-error: true
        run: cd plugins && npm test
      - name: Static gates
        run: bash scripts/ci/check.sh --only phone-no-dsh-patch,phone-hygiene,phone-license,phone-modules,phone-spec,phone-gate-contracts
      - name: Android-port contract gates
        # The four contract trees (spec/host, spec/platform, spec/ui) plus the
        # catalog, bridge, gateway, trajectory and fixture checkers. Host
        # independent: this is where the Kotlin host's contract is judged.
        run: bash scripts/ci/check.sh --only phone-p0-conformance
      - name: Cross-tree consistency
        # The eight invariants that only hold across two spec trees (the UI
        # README <-> tokens.json composition is one of them) and the checker's
        # own mutation tests. Python only: it runs here, next to the per-tree
        # gates, so a spec-only change never spins up Gradle + Rust on the
        # Android host.
        run: bash scripts/ci/check.sh --only phone-cross-tree
      - name: M99 compatibility gate
        # The shared TypeScript must stay inside the Chromium 99 baseline that
        # the Huawei WebView pins; exceeding it has to fail the pack, not the
        # device.
        run: bash scripts/ci/check.sh --only phone-compat
      - name: Xcode package resolution
        run: bash scripts/ci/check.sh --only phone-xcode-resolve
      - name: Image
        run: bash scripts/ci/check.sh --only phone-image
      - name: Swift
        run: bash scripts/ci/check.sh --only phone-sdk
      - name: macOS WKWebView smoke
        run: bash scripts/ci/smoke.sh
      # Runs even when a soft step above failed or a later gate stopped the job,
      # so a single red board always names every soft failure it saw.
      - name: Gate summary
        if: always()
        run: |
          set -u
          status=0
          for entry in \
            "plugins-typecheck:${{ steps.plugins-typecheck.outcome }}" \
            "plugins-tests:${{ steps.plugins-tests.outcome }}"; do
            name=${entry%%:*}
            outcome=${entry#*:}
            if [ "$outcome" != "success" ]; then
              echo "::error::${name} finished with outcome '${outcome}'"
              status=1
            fi
          done
          exit "$status"
